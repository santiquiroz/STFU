[package]
name = "stfu"
version = "1.7.0"
description = "STFU — Suppress The Frustrating Unwanted noise"
authors = ["Santiago Quiroz"]
edition = "2021"

[lib]
name = "stfu_lib"
# staticlib/cdylib solo se necesitan para mobile; en Windows el archiver
# choca con el escaneo de Defender sobre los temp-archive
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
