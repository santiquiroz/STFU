[package]
name = "stfu"
version = "0.1.0"
description = "STFU — Suppress The Frustrating Unwanted noise"
authors = ["Santiago Quiroz"]
edition = "2021"

[lib]
name = "stfu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
